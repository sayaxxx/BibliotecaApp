<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400">
  <defs>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f72"/>
      <stop offset="1" stop-color="#2b2b52"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="b5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="b6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Estantería -->
    <rect x="46" y="330" width="428" height="20" rx="8" fill="url(#shelf)"/>

    <!-- Libro 1 (independiente) -->
    <rect x="70" y="240" width="30" height="90" rx="7" fill="url(#b1)"/>
    <rect x="79" y="250" width="12" height="74" rx="4" fill="#fff6" />

    <!-- Libro 2 levemente inclinado -->
    <g transform="rotate(-6 120 245)">
      <rect x="108" y="238" width="30" height="92" rx="7" fill="url(#b2)"/>
      <rect x="117" y="248" width="12" height="76" rx="4" fill="#fff6" />
    </g>

    <!-- Pila apilada -->
    <rect x="150" y="288" width="86" height="16" rx="6" fill="url(#b3)"/>
    <rect x="154" y="270" width="86" height="16" rx="6" fill="url(#b4)"/>
    <rect x="150" y="252" width="86" height="16" rx="6" fill="url(#b5)"/>

    <!-- Libro abierto -->
    <path d="M282 322 C294 310 318 306 340 310 L340 330 C318 326 296 330 284 340 Z" fill="#ffffff"/>
    <path d="M340 310 C362 306 386 310 398 322 L396 340 C382 330 360 326 340 330 Z" fill="#eef2ff"/>
    <path d="M340 310 L340 330" stroke="#c7d2fe" stroke-width="2"/>

    <!-- Libros verticales -->
    <rect x="414" y="234" width="32" height="96" rx="7" fill="url(#b6)"/>
    <rect x="450" y="240" width="30" height="90" rx="7" fill="url(#b1)"/>

    <!-- Planta decorativa -->
    <path d="M250 340 C240 300 240 270 250 250" stroke="#047857" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="238" cy="240" rx="20" ry="12" fill="#10b981" transform="rotate(-30 238 240)"/>
    <ellipse cx="264" cy="246" rx="18" ry="12" fill="#059669" transform="rotate(20 264 246)"/>
    <ellipse cx="250" cy="232" rx="16" ry="11" fill="#34d399" transform="rotate(-5 250 232)"/>

    <!-- Lámpara -->
    <path d="M108 250 L108 300" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 250 L128 250 L118 226 L98 226 Z" fill="#fbbf24"/>
  </g>
</svg>